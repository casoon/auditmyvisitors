name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # No OAuth secrets here: credentials are read with option_env! and fall back
      # to placeholders, which is enough for everything but an actual login.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  windows:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Guards the non-Unix branches, above all the token file permissions in
      # src/storage, which the Linux job never compiles.
      - name: Check
        run: cargo check --all-targets

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the rust-version in Cargo.toml. A declared minimum that
      # nothing builds against is a guess, not a promise. The number holds for
      # the committed Cargo.lock: it is the dependency tree, not this crate,
      # that sets it — image and time need 1.88, runemark only 1.85.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets
